project:
  type: book
  output-dir: docs          # GitHub Pages 从 main 分支的 docs/ 发布
  resources:
    # quarto render 会清空 output-dir，手工放进 docs/ 的文件会被删掉。
    # .nojekyll 让 Pages 跳过 Jekyll 处理（否则 site_libs/ 等资源可能被忽略），
    # 声明成 resource 后每次渲染都会从项目根复制过去，不会再丢。
    - .nojekyll

book:
  title: "因果推断读书笔记"
  subtitle: "24 周学习记录 · causalR"
  author: "HUI950319"
  site-url: https://hui950319.github.io/causalR/
  repo-url: https://github.com/HUI950319/causalR
  repo-actions: [source, issue]
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "阶段一 · 估计量全景"
      chapters:
        - notes/w01-potential-outcomes.qmd
        - notes/w01-randomized-experiments.qmd
        - notes/w01-observational-studies.qmd
        - notes/w01-effect-modification.qmd
        - notes/w01-interaction.qmd
        - notes/w02-causal-diagrams.qmd
        - notes/w02-confounding.qmd

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark:  [darkly, custom.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    # 宽表格与手绘图用 .column-page 突破正文列，见各章内的 div
    grid:
      body-width: 800px
      sidebar-width: 380px
      margin-width: 380px

lang: zh
