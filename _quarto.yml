project:
  type: book
  output-dir: docs          # GitHub Pages 从 main 分支的 docs/ 发布
  resources:
    # quarto render 会清空 output-dir，手工放进 docs/ 的文件会被删掉。
    # .nojekyll 让 Pages 跳过 Jekyll 处理（否则 site_libs/ 等资源可能被忽略），
    # 声明成 resource 后每次渲染都会从项目根复制过去，不会再丢。
    - .nojekyll
    # iframe 的 src 不在 Quarto 的资源跟踪范围内，不显式声明，
    # 清空 output-dir 后课程讲义就是 404。
    - notes/slides/*.pdf
    - notes/code/*.R

book:
  title: "因果推断读书笔记"
  subtitle: "24 周学习记录 · causalR"
  author: "HUI950319"
  site-url: https://hui950319.github.io/causalR/
  repo-url: https://github.com/HUI950319/causalR
  repo-actions: [source, issue]
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - notes/w01-logic-chain.qmd
    - notes/notation.qmd
    - notes/identifiability.qmd
    - notes/formulas.qmd
