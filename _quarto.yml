        - notes/w01-observational-studies.qmd
        - notes/w01-effect-modification.qmd
        - notes/w01-interaction.qmd
        - notes/w02-causal-diagrams.qmd
        - notes/w02-confounding.qmd
        - notes/w02-selection-bias.qmd
        - notes/w02-measurement-bias.qmd
        - notes/w02-random-variability.qmd
    - part: "原书第二部分 · 有模型的因果推断"
