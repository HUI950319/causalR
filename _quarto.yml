format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark:  [darkly, custom.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    # 宽表格与手绘图用 .column-page 突破正文列，见各章内的 div
    grid:
      body-width: 800px
      sidebar-width: 380px
      margin-width: 380px

